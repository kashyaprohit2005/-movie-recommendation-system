<!DOCTYPE html>
<html>
<head>
    <title>AI Movie Expert</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        /* Standalone Dark Mode CSS */
        body {
            background-color: #0f0f0f;
            background-image: url("../static/image.jpg");
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Montserrat', sans-serif;
            color: #f5f5f5;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .chat-container {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .chat-header {
            background: rgba(229, 9, 20, 0.8);
            padding: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .home-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .home-btn:hover { background: rgba(0,0,0,0.6); }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-history::-webkit-scrollbar { width: 8px; }
        .chat-history::-webkit-scrollbar-thumb { background: #e50914; border-radius: 10px; }

        .msg {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .msg-ai {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg-user {
            background: #e50914;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-input-box {
            padding: 20px;
            background: rgba(10, 10, 10, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        .chat-input-box input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 20px;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .chat-input-box input:focus { border-color: #e50914; }

        .chat-input-box button {
            background: #e50914;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }

        .chat-input-box button:hover {
            background: #b30000;
            transform: scale(1.05);
        }
        
        .thinking { opacity: 0.7; font-style: italic; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <span><i class="fa fa-film"></i> Cinematic AI Expert</span>
            <a href="/" class="home-btn"><i class="fa fa-home"></i> Back</a>
        </div>
        
        <div class="chat-history" id="chatHistory">
            <div class="msg msg-ai">Hello! I know everything about movies, TV shows, and actors. What would you like to know?</div>
        </div>
        
        <div class="chat-input-box">
            <input type="text" id="userInput" placeholder="Ask a movie question..." autocomplete="off">
            <button id="sendBtn"><i class="fa fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Standalone Javascript Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const inputField = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const chatHistory = document.getElementById("chatHistory");

            function addMessage(text, sender, isThinking = false) {
                const div = document.createElement("div");
                div.className = `msg msg-${sender}`;
                if (isThinking) div.classList.add("thinking");
                
                // Bold formatting fallback (Gemini sometimes uses markdown)
                div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                
                const id = 'msg-' + Date.now();
                div.id = id;
                chatHistory.appendChild(div);
                chatHistory.scrollTop = chatHistory.scrollHeight;
                return id;
            }

            function sendMessage() {
                const text = inputField.value.trim();
                if (!text) return;

                addMessage(text, "user");
                inputField.value = "";

                const thinkingId = addMessage("Thinking...", "ai", true);

                fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                })
                .then(res => res.json())
                .then(data => {
                    document.getElementById(thinkingId).remove();
                    if (data.success) {
                        addMessage(data.reply, "ai");
                    } else {
                        addMessage("Error: " + data.message, "ai");
                    }
                })
                .catch(err => {
                    document.getElementById(thinkingId).remove();
                    addMessage("Connection error. Please try again.", "ai");
                });
            }

            sendBtn.addEventListener("click", sendMessage);
            inputField.addEventListener("keypress", function(e) {
                if (e.key === "Enter") sendMessage();
            });
        });
    </script>
</body>
</html>
